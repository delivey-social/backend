services:
  backend-dev:
    image: cosmtrek/air
    working_dir: /app
    ports:
      - 3001:8080
    volumes:
      - ./:/app
    command: ["air", "-c", "/app/.air.toml"]
    depends_on:
      - db
  backend-build:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 3001:3001
    command: ["./main"]
    depends_on:
      - db
  db:
    image: postgres:16
    container_name: backend_db
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: delivery_social
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
