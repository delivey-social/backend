info:
  name: Keycloak - Get Users
  type: http
  seq: 9

http:
  method: GET
  url: "{{keycloak_url}}/admin/realms/:realm/users"
  params:
    - name: realm
      value: master
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
