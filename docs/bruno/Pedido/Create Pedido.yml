info:
  name: Create Pedido
  type: http
  seq: 3

http:
  method: POST
  url: "{{api_url}}/pedido/"
  body:
    type: json
    data: |-
      {
        "user_id": "{{$randomUUID}}",
        "restaurant_id": "{{$randomUUID}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
