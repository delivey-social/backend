info:
  name: Create Pedido
  type: http
  seq: 3

http:
  method: POST
  url: "{{api_url}}/pedido/"
  body:
    type: json
    data: |-
      {
        "user_id": "{{$randomUUID}}",
        "restaurant_id": "{{restaurant_id}}",
        "items": [{
          "product_id": "{{item_id}}",
          "quantity": 1
        }]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();

        if (response && response.id) {
          bru.setEnvVar("pedido_id", response.id)
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
