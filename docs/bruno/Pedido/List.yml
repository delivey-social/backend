info:
  name: List
  type: http
  seq: 1

http:
  method: GET
  url: "{{api_url}}/pedido/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();

        if (response && response?.pedidos?.length) {
          bru.setEnvVar("pedido_id", response.pedidos[0].id)
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
