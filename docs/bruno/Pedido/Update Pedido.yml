info:
  name: Update Pedido
  type: http
  seq: 4

http:
  method: PUT
  url: "{{api_url}}/pedido/:id"
  params:
    - name: id
      value: "{{pedido_id}}"
      type: path
  body:
    type: json
    data: |-
      {
        "user_id": "{{$randomUUID}}",
        "restaurant_id": "{{restaurant_id}}",
        "items": [{
          "product_id": "{{item_id}}",
          "quantity": 1
        }],
        "status": "pending"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
