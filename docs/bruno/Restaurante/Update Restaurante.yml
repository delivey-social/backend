info:
  name: Update Restaurante
  type: http
  seq: 4

http:
  method: PUT
  url: "{{api_url}}/restaurante/:id"
  params:
    - name: id
      value: "{{$randomUUID}}"
      type: path
  body:
    type: json
    data: |-
      {
        "nome": "{{$randomCompanyName}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
