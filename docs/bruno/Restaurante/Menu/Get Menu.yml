info:
  name: Get Menu
  type: http
  seq: 1

http:
  method: GET
  url: "{{api_url}}/menu/:restaurante_id"
  params:
    - name: restaurante_id
      value: "{{restaurant_id}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();

        if (response && response?.itens?.length > 0) {
          bru.setEnvVar("item_id", response.itens[0].id)
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
