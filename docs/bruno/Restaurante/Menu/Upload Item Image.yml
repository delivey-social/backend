info:
  name: Upload Item Image
  type: http
  seq: 7

http:
  method: PUT
  url: "{{api_url}}/menu/:restaurante_id/:item_id/image"
  params:
    - name: item_id
      value: "{{item_id}}"
      type: path
    - name: restaurante_id
      value: "{{restaurant_id}}"
      type: path
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - C:\Users\thiago.tolotti\Downloads\the-who-sell-out-back.jpg
        contentType: image/jpeg
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
