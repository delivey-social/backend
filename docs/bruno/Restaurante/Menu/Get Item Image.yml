info:
  name: Get Item Image
  type: http
  seq: 6

http:
  method: GET
  url: "{{api_url}}/menu/:restaurante_id/:item_id/image"
  params:
    - name: restaurante_id
      value: "{{restaurant_id}}"
      type: path
    - name: item_id
      value: "{{item_id}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
