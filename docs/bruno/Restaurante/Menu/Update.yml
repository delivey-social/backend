info:
  name: Update
  type: http
  seq: 2

http:
  method: PUT
  url: "{{api_url}}/menu/:restaurante_id/:item_id"
  params:
    - name: item_id
      value: "{{item_id}}"
      type: path
    - name: restaurante_id
      value: "{{restaurant_id}}"
      type: path
  body:
    type: json
    data: |-
      {
        "nome": "{{$randomCompanyName}}",
        "preco": 300
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
